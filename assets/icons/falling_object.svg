<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 낙하 물체 (박스) -->
  <rect x="35" y="8" width="30" height="28" rx="3" fill="#D69E2E" opacity="0.9"/>
  <!-- 박스 윗면 (3D 효과) -->
  <line x1="35" y1="8" x2="42" y2="2" stroke="#D69E2E" stroke-width="2.5"/>
  <line x1="65" y1="8" x2="72" y2="2" stroke="#D69E2E" stroke-width="2.5"/>
  <line x1="42" y1="2" x2="72" y2="2" stroke="#D69E2E" stroke-width="2.5"/>
  <!-- 속도 선 -->
  <line x1="28" y1="20" x2="18" y2="20" stroke="#D69E2E" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="28" x2="14" y2="28" stroke="#D69E2E" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- 화살표 -->
  <line x1="50" y1="38" x2="50" y2="58" stroke="#D69E2E" stroke-width="3"/>
  <polygon points="42,55 50,68 58,55" fill="#D69E2E"/>
  <!-- 사람 (피해자) -->
  <circle cx="50" cy="78" r="7" fill="none" stroke="#D69E2E" stroke-width="4"/>
  <!-- 충격 표시 -->
  <line x1="38" y1="68" x2="32" y2="62" stroke="#D69E2E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="68" x2="68" y2="62" stroke="#D69E2E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="66" x2="50" y2="59" stroke="#D69E2E" stroke-width="2.5" stroke-linecap="round"/>
</svg>

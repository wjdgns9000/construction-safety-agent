name: 주간 사고데이터 수집

on:
  schedule:
    # 일요일 23:00 UTC = 월요일 08:00 KST
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: '날짜 (YYYYMMDD, 비어있으면 오늘)'
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install requests

      - name: 날짜 설정
        id: date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date +%Y%m%d); fi
          echo "value=$DATE" >> $GITHUB_OUTPUT

      - name: KOSHA 수집
        env:
          KOSHA_API_KEY: ${{ secrets.KOSHA_API_KEY }}
        run: python scripts/collect_kosha.py --mode weekly --date ${{ steps.date.outputs.value }}

      - name: Naver 뉴스 수집
        run: python scripts/collect_naver.py --mode weekly --date ${{ steps.date.outputs.value }}

      - name: 수집 결과 확인
        id: check
        run: |
          FILE="output/raw/${{ steps.date.outputs.value }}.json"
          COUNT=$(python -c "import json; print(len(json.load(open('$FILE'))))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "수집 건수: $COUNT"

      - name: 결과 커밋 & 푸시
        if: steps.check.outputs.count > 0
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add output/raw/
          git diff --staged --quiet || git commit -m "data: 주간 수집 ${{ steps.date.outputs.value }} (${{ steps.check.outputs.count }}건)"
          git push

      - name: 완료 이메일 발송
        if: steps.check.outputs.count > 0
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          python - <<'EOF'
          import smtplib, os
          from email.mime.text import MIMEText
          date = "${{ steps.date.outputs.value }}"
          count = "${{ steps.check.outputs.count }}"
          sender = os.environ["GMAIL_SENDER"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          recipient = os.environ["GMAIL_RECIPIENT"]
          body = f"""안녕하세요.

          이번 주 건설업 사고 데이터 수집이 완료됐습니다.

          📅 날짜: {date}
          📊 수집 건수: {count}건

          ✅ 지금 PPT를 생성하려면 Claude Code에 아래 문장을 입력하세요:
          weekly 파이프라인 실행

          (입력 전에 git pull 먼저 실행해 최신 데이터를 받으세요)

          본 메일은 자동 발송됩니다.
          """
          msg = MIMEText(body)
          msg["Subject"] = f"[건설안전] 주간 데이터 수집 완료 — {count}건"
          msg["From"] = sender
          msg["To"] = recipient
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(sender, password)
              smtp.send_message(msg)
          print("이메일 발송 완료")
          EOF
